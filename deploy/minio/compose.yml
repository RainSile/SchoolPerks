name: campus-perks-storage
services:
  minio:
    image: campus-minio:RELEASE.2025-10-15T17-29-55Z
    build: .
    command: [server, --address, ":9000", --quiet, /data]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${MINIO_MEMORY_LIMIT:-256m}
    memswap_limit: ${MINIO_MEMORY_SWAP_LIMIT:-384m}
    cpus: 0.35
    ports: ["127.0.0.1:9000:9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
      MINIO_API_REQUESTS_MAX: "2"
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:?required}
      MINIO_SCANNER_SPEED: slowest
      GOMEMLIMIT: 160MiB
      GOMAXPROCS: "2"
      GOGC: "50"
      HOME: /tmp
    volumes: ["./data:/data"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/ready]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
